services:
  postgres:
    image: postgres:16-alpine
    container_name: nds_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nds_travel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/travel_schema.sql:/docker-entrypoint-initdb.d/01_travel_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nds_travel}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nds_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nds_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@nds.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - nds_network

volumes:
  postgres_data:
    name: nds_postgres_data
  pgadmin_data:
    name: nds_pgadmin_data

networks:
  nds_network:
    name: nds_network
    driver: bridge
